<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameClip Upload API Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Pretendard, "Segoe UI", sans-serif;
        background: #0b0d12;
        color: #f2f4f8;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        margin: 0;
        background:
          linear-gradient(135deg, rgb(16 20 30 / 92%), rgb(7 9 14 / 98%)),
          #0b0d12;
      }

      button,
      input {
        font: inherit;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 36px 0 56px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(28px, 4vw, 46px);
        line-height: 1.05;
      }

      h2 {
        font-size: 18px;
      }

      .muted {
        color: #a5afc4;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
        gap: 18px;
      }

      .panel {
        border: 1px solid #293044;
        border-radius: 8px;
        background: #111622;
        padding: 18px;
      }

      form,
      .stack {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #c6cee0;
        font-size: 13px;
      }

      input {
        min-width: 0;
        border: 1px solid #35415c;
        border-radius: 6px;
        background: #090c13;
        color: inherit;
        padding: 11px 12px;
      }

      input[type="file"] {
        padding: 9px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        border: 1px solid #2b7fff;
        border-radius: 6px;
        background: #1368e8;
        color: white;
        cursor: pointer;
        padding: 10px 13px;
      }

      button.secondary {
        border-color: #35415c;
        background: #1b2232;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      #status {
        min-height: 44px;
        border-radius: 6px;
        background: #090c13;
        color: #d7e3ff;
        padding: 12px;
        white-space: pre-wrap;
      }

      video {
        width: 100%;
        min-height: 280px;
        max-height: 62vh;
        border-radius: 8px;
        background: #05070b;
      }

      #videos {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .video-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto auto;
        gap: 10px;
        align-items: center;
        border: 1px solid #293044;
        border-radius: 7px;
        background: #0c111c;
        padding: 11px;
      }

      .video-row strong,
      .video-row small {
        display: block;
        overflow-wrap: anywhere;
      }

      .video-row small {
        color: #9aa7c0;
        margin-top: 4px;
      }

      .api-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      @media (max-width: 820px) {
        main {
          width: min(100% - 20px, 640px);
          padding-top: 24px;
        }

        header,
        .grid {
          grid-template-columns: 1fr;
          display: grid;
        }

        video {
          min-height: 210px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="muted">GameClip backend smoke test</p>
          <h1>Upload, list, play.</h1>
        </div>
        <p id="summary" class="muted"></p>
      </header>

      <div class="grid">
        <section class="panel stack">
          <h2>Upload API</h2>
          <label>
            API base URL
            <span class="api-row">
              <input id="apiBaseUrl" aria-label="API base URL" />
              <button id="refreshButton" class="secondary" type="button">Refresh list</button>
            </span>
          </label>

          <form id="uploadForm">
            <label>
              Video file
              <input id="videoFile" name="video" type="file" accept="video/*" required />
            </label>
            <label>
              Title
              <input name="title" value="Smoke test clip" />
            </label>
            <label>
              Game name
              <input name="gameName" value="Demo game" />
            </label>
            <label>
              Game tag
              <input name="gameTag" value="demo" />
            </label>
            <label>
              Uploader
              <input name="uploader" value="Presenter" />
            </label>
            <label>
              Password (optional)
              <input name="password" type="password" autocomplete="new-password" placeholder="Set this to protect edits and deletion" />
            </label>
            <div class="actions">
              <button id="uploadButton">Upload video</button>
            </div>
          </form>

          <output id="status">Waiting for an API check.</output>
        </section>

        <section class="panel stack">
          <h2 id="playerTitle">Playback</h2>
          <video id="player" controls playsinline></video>
          <div id="videos" aria-live="polite"></div>
        </section>
      </div>
    </main>

    <script>
      const apiInput = document.querySelector("#apiBaseUrl");
      const form = document.querySelector("#uploadForm");
      const status = document.querySelector("#status");
      const player = document.querySelector("#player");
      const playerTitle = document.querySelector("#playerTitle");
      const videos = document.querySelector("#videos");
      const summary = document.querySelector("#summary");
      const uploadButton = document.querySelector("#uploadButton");
      const refreshButton = document.querySelector("#refreshButton");
      const apiPort = "4000";
      const defaultApiBaseUrl = `${window.location.protocol}//${window.location.hostname}:${apiPort}`;

      apiInput.value = defaultApiBaseUrl;

      apiInput.addEventListener("change", () => {
        apiInput.value = cleanApiBaseUrl();
      });
      refreshButton.addEventListener("click", refreshVideos);
      form.addEventListener("submit", uploadVideo);

      refreshVideos();

      async function uploadVideo(event) {
        event.preventDefault();
        const file = document.querySelector("#videoFile").files[0];

        if (!file) {
          writeStatus("Choose a video file first.", true);
          return;
        }

        const body = new FormData(form);
        setBusy(true);
        writeStatus(`Uploading ${file.name} (${formatBytes(file.size)})...`);

        try {
          const response = await fetch(`${cleanApiBaseUrl()}/api/videos`, {
            method: "POST",
            body,
          });
          const payload = await readPayload(response);

          if (!response.ok) {
            throw new Error(payload.message || `Upload failed with ${response.status}.`);
          }

          writeStatus(`Uploaded ${payload.title}.\nPlayback URL: ${payload.videoUrl}`);
          playVideo(payload);
          await refreshVideos(false);
        } catch (error) {
          writeStatus(error.message, true);
        } finally {
          setBusy(false);
        }
      }

      async function refreshVideos(reportSuccess = true) {
        setBusy(true);

        try {
          const response = await fetch(`${cleanApiBaseUrl()}/api/videos`);
          const payload = await readPayload(response);

          if (!response.ok) {
            throw new Error(payload.message || `List failed with ${response.status}.`);
          }

          renderVideos(payload);

          if (reportSuccess) {
            writeStatus(`Loaded ${payload.length} uploaded video(s) from ${cleanApiBaseUrl()}.`);
          }
        } catch (error) {
          videos.replaceChildren();
          summary.textContent = "API unavailable";
          writeStatus(error.message, true);
        } finally {
          setBusy(false);
        }
      }

      function renderVideos(items) {
        videos.replaceChildren();
        summary.textContent = `${items.length} uploaded video(s)`;

        if (!items.length) {
          videos.textContent = "No uploaded videos yet.";
          return;
        }

        for (const item of items) {
          const row = document.createElement("article");
          row.className = "video-row";

          const text = document.createElement("div");
          const title = document.createElement("strong");
          const meta = document.createElement("small");
          title.textContent = item.title || item.originalName;
          meta.textContent =
            `게임: ${item.gameName || "no game"} | 태그: ${item.gameTag || "no tag"} | 업로더: ${item.uploader} | ${item.hasPassword ? "비밀번호 보호됨" : "공개 수정/삭제"} | 크기: ${formatBytes(item.size)} | 시간: ${formatTimestamp(item.createdAt)} | ${item.videoUrl}`;
          text.append(title, meta);

          const playButton = document.createElement("button");
          playButton.type = "button";
          playButton.textContent = "Play";
          playButton.addEventListener("click", () => playVideo(item));

          const editButton = document.createElement("button");
          editButton.type = "button";
          editButton.className = "secondary";
          editButton.textContent = "Edit";
          editButton.addEventListener("click", () => editVideo(item));

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "secondary";
          deleteButton.textContent = "Delete";
          deleteButton.addEventListener("click", () => deleteVideo(item));

          row.append(text, playButton, editButton, deleteButton);
          videos.append(row);
        }
      }

      async function editVideo(item) {
        const nextTitle = prompt("새 제목을 입력하세요.", item.title || item.originalName);

        if (nextTitle === null) {
          return;
        }

        const nextGameName = prompt("새 게임명을 입력하세요.", item.gameName || "");

        if (nextGameName === null) {
          return;
        }

        const nextGameTag = prompt("새 태그를 입력하세요.", item.gameTag || "");

        if (nextGameTag === null) {
          return;
        }

        const nextUploader = prompt("새 업로드 닉네임을 입력하세요.", item.uploader || "");

        if (nextUploader === null) {
          return;
        }

        const password = item.hasPassword ? prompt("이 영상의 비밀번호를 입력하세요.") : "";

        if (item.hasPassword && password === null) {
          return;
        }

        setBusy(true);
        writeStatus(`Updating ${item.title || item.originalName}...`);

        try {
          const response = await fetch(`${cleanApiBaseUrl()}/api/videos/${item.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: nextTitle,
              gameName: nextGameName,
              gameTag: nextGameTag,
              uploader: nextUploader,
              password,
            }),
          });
          const payload = await readPayload(response);

          if (!response.ok) {
            throw new Error(payload.message || `Update failed with ${response.status}.`);
          }

          writeStatus(`Updated ${payload.title || payload.originalName}.`);
          await refreshVideos(false);
        } catch (error) {
          writeStatus(error.message, true);
        } finally {
          setBusy(false);
        }
      }

      async function deleteVideo(item) {
        const password = item.hasPassword ? prompt("이 영상을 삭제하려면 비밀번호를 입력하세요.") : "";

        if (item.hasPassword && password === null) {
          return;
        }

        setBusy(true);
        writeStatus(`Deleting ${item.title || item.originalName}...`);

        try {
          const response = await fetch(`${cleanApiBaseUrl()}/api/videos/${item.id}`, {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });

          if (!response.ok) {
            const payload = await readPayload(response);
            throw new Error(payload.message || `Delete failed with ${response.status}.`);
          }

          if (player.currentSrc === item.videoUrl) {
            player.removeAttribute("src");
            player.load();
            playerTitle.textContent = "Playback";
          }

          writeStatus(`Deleted ${item.title || item.originalName}.`);
          await refreshVideos(false);
        } catch (error) {
          writeStatus(error.message, true);
        } finally {
          setBusy(false);
        }
      }

      function playVideo(item) {
        player.src = item.videoUrl;
        playerTitle.textContent = `Playback: ${item.title || item.originalName}`;
        player.load();
      }

      function cleanApiBaseUrl() {
        return apiInput.value.trim().replace(/\/$/, "");
      }

      function setBusy(busy) {
        uploadButton.disabled = busy;
        refreshButton.disabled = busy;
      }

      function writeStatus(message, isError = false) {
        status.textContent = message;
        status.style.color = isError ? "#ffb1b1" : "#d7e3ff";
      }

      async function readPayload(response) {
        const text = await response.text();
        return text ? JSON.parse(text) : {};
      }

      function formatBytes(bytes) {
        if (!Number.isFinite(bytes)) {
          return "unknown size";
        }

        const units = ["B", "KB", "MB", "GB"];
        let size = bytes;
        let unit = units.shift();

        while (size >= 1024 && units.length) {
          size /= 1024;
          unit = units.shift();
        }

        return `${size.toFixed(size >= 10 || unit === "B" ? 0 : 1)} ${unit}`;
      }

      function formatTimestamp(value) {
        if (!value) {
          return "unknown time";
        }

        const timestamp = new Date(value);

        if (Number.isNaN(timestamp.getTime())) {
          return value;
        }

        return timestamp.toLocaleString();
      }
    </script>
  </body>
</html>
